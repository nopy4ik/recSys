<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4f0">
  <title>Подбор автомобиля</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a class="wordmark" href="/">Подбор авто</a>
  </header>

  <main>
    <section class="intro">
      <div class="intro-copy">
        <h1>Подбор автомобиля</h1>
        <p class="lede">Укажите бюджет и важные характеристики. Подходящие машины ранжируются по связям в матрице предпочтений покупателей.</p>
      </div>
    </section>

    <form class="filters" action="/" method="get">
      <label class="field budget-field"><span>Бюджет до</span><span class="input-unit"><input name="budget" type="number" min="0" max="20000000" step="100000" value="$budget"><span>₽</span></span></label>
      <label class="field"><span>Марка</span><select name="brand">$brand_options</select></label>
      <label class="field body-field"><span>Тип кузова</span><select name="body">$body_options</select></label>
      <label class="field"><span>Год выпуска</span><select name="year">$year_options</select></label>
      <label class="field"><span>Мощность</span><select name="power">$power_options</select></label>
      <label class="field"><span>Топливо</span><select name="fuel">$fuel_options</select></label>
      <label class="field"><span>Коробка передач</span><select name="transmission">$transmission_options</select></label>
      <label class="field"><span>Привод</span><select name="drive">$drive_options</select></label>
      <button type="submit">Подобрать автомобили <span aria-hidden="true">→</span></button>
    </form>

    <section class="recommendations" aria-labelledby="results-title">
        <div class="section-head results-head"><h2 id="results-title">Рекомендуем посмотреть</h2><span class="result-count">$result_count $result_word</span></div>
        <div class="result-list">$results</div>
    </section>
  </main>

</body>
</html>
